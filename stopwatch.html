<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말티즈 스탑워치</title>
<style>
  :root { --bg:#fdf3e7; --card:#fff; --text:#3a2e2a; --muted:#a39488; --accent:#ff8fa3; --stop:#6c9bd1; --line:#f1e4d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1916; --card:#272220; --text:#f6ece4; --muted:#9c8f84; --line:#3a332f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:'Segoe UI','Malgun Gothic',sans-serif; padding:16px; }
  .card { background:var(--card); border-radius:24px; padding:18px; width:100%; max-width:760px;
    box-shadow:0 10px 36px rgba(120,80,40,.15); }
  .scene { position:relative; border-radius:16px; overflow:hidden; line-height:0; }
  canvas { width:100%; height:auto; display:block; }
  .lapbox { position:absolute; top:10px; left:10px; max-height:46%; min-width:150px; overflow-y:auto;
    background:rgba(255,255,255,.82); color:#3a2e2a; border-radius:12px; padding:6px 10px;
    font-size:13px; line-height:1.5; font-variant-numeric:tabular-nums; display:none;
    backdrop-filter:blur(3px); box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .lapbox div { display:flex; justify-content:space-between; gap:14px; }
  .lapbox div span:first-child { color:#a39488; }
  .lapbox .best { color:#16a34a; font-weight:700; }
  .lapbox .worst { color:#e11d48; font-weight:700; }
  .time { font-size:clamp(40px,11vw,62px); font-weight:300; text-align:center;
    font-variant-numeric:tabular-nums; letter-spacing:1px; margin:14px 0 14px; }
  .time small { font-size:.5em; color:var(--muted); }
  .btns { display:flex; gap:12px; }
  button { flex:1; padding:14px; font-size:16px; font-weight:700; border:none; border-radius:14px;
    cursor:pointer; color:#fff; transition:opacity .15s, transform .05s; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.35; cursor:default; }
  #start { background:var(--accent); }
  #start.running { background:var(--stop); }
  #lap, #reset { background:#b9a99b; }
  .hint { text-align:center; color:var(--muted); font-size:12px; margin-top:12px; }
</style>
</head>
<body>
<div class="card">
  <div class="scene">
    <canvas id="cv"></canvas>
    <div class="lapbox" id="laps"></div>
  </div>
  <div class="time" id="display">00:00.<small>00</small></div>
  <div class="btns">
    <button id="lap" disabled>랩</button>
    <button id="start">시작</button>
    <button id="reset" disabled>초기화</button>
  </div>
  <div class="hint">스페이스: 시작/정지 · L: 랩 · R: 초기화<br>이미지: Google Noto Emoji (Apache-2.0) · Twemoji (CC-BY 4.0)</div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const display = $('display'), startBtn = $('start'), lapBtn = $('lap'), resetBtn = $('reset'), lapsEl = $('laps');
  const cv = $('cv'), ctx = cv.getContext('2d');
  const W = 720, H = 300, GY = 250, SPEED = 300, START_X = 90, RUN_X = 230;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);

  /* ---------- 스톱워치 로직 ---------- */
  let running = false, startTime = 0, elapsed = 0, laps = [], lastLapTime = 0;
  const pad = (n, l = 2) => String(n).padStart(l, '0');
  function fmt(ms) {
    const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60, c = Math.floor(ms / 10) % 100;
    return { text: `${pad(m)}:${pad(s)}.`, cs: pad(c) };
  }
  const fmtFull = ms => { const f = fmt(ms); return f.text + f.cs; };

  function renderTime() {
    const cur = running ? performance.now() - startTime : elapsed;
    const f = fmt(cur);
    display.innerHTML = `${f.text}<small>${f.cs}</small>`;
  }

  function toggle() {
    if (running) {
      elapsed = performance.now() - startTime;
      running = false;
      startBtn.textContent = '계속'; startBtn.classList.remove('running');
      lapBtn.disabled = true;
      enterSit();
    } else {
      startTime = performance.now() - elapsed;
      running = true;
      startBtn.textContent = '정지'; startBtn.classList.add('running');
      lapBtn.disabled = false; resetBtn.disabled = false;
      state = 'run';
    }
    renderTime();
  }

  function lap() {
    if (!running) return;
    const now = performance.now() - startTime;
    laps.push({ split: now - lastLapTime, total: now });
    lastLapTime = now;
    drawLaps();
    triggerLapEvent();
  }

  function drawLaps() {
    lapsEl.innerHTML = '';
    lapsEl.style.display = laps.length ? 'block' : 'none';
    let best = -1, worst = -1;
    if (laps.length > 1) {
      const s = laps.map(l => l.split);
      best = s.indexOf(Math.min(...s)); worst = s.indexOf(Math.max(...s));
    }
    for (let i = laps.length - 1; i >= 0; i--) {
      const d = document.createElement('div');
      if (i === best) d.className = 'best'; else if (i === worst) d.className = 'worst';
      d.innerHTML = `<span>랩 ${i + 1}</span><span>${fmtFull(laps[i].split)}</span>`;
      d.title = '누적 ' + fmtFull(laps[i].total);
      lapsEl.appendChild(d);
    }
    lapsEl.scrollTop = 0;
  }

  function reset() {
    running = false; elapsed = 0; lastLapTime = 0; laps = [];
    startBtn.textContent = '시작'; startBtn.classList.remove('running');
    lapBtn.disabled = true; resetBtn.disabled = true;
    drawLaps(); renderTime();
    state = 'idle'; dogX = START_X; scroll = 0;
    hurdles = []; treat = null; jump = null; hearts = []; bag = [];
  }

  startBtn.onclick = toggle; lapBtn.onclick = lap; resetBtn.onclick = reset;
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key.toLowerCase() === 'l') lap();
    else if (e.key.toLowerCase() === 'r' && !resetBtn.disabled) reset();
  });

  /* ---------- 애니메이션 상태 ---------- */
  let state = 'idle';           // idle | run | sit
  let dogX = START_X, scroll = 0, t = 0, runPhase = 0, sitT = 0;
  let hurdles = [], treat = null, jump = null, hearts = [];
  let bag = [];                 // 장애물/간식 5:5 보장용
  const THROW_T = 0.95;         // 간식이 입에 도착하는 시간

  function enterSit() { state = 'sit'; sitT = 0; hurdles = []; treat = null; jump = null; }

  function triggerLapEvent() {
    if (treat || jump) return;
    if (!bag.length) bag = Math.random() < 0.5 ? ['hurdle', 'treat'] : ['treat', 'hurdle'];
    if (bag.shift() === 'hurdle') hurdles.push({ x: W + 30 });
    else treat = { t: 0, eaten: false };
  }

  function update(dt) {
    t += dt;
    if (state === 'run') {
      scroll += SPEED * dt;
      runPhase += dt * 14;
      dogX += (RUN_X - dogX) * Math.min(1, dt * 3);
      for (const h of hurdles) h.x -= SPEED * dt;
      hurdles = hurdles.filter(h => h.x > -80);
      if (!jump) {
        const h = hurdles.find(h => h.x - dogX < 120 && h.x > dogX - 10);
        if (h) jump = { t: 0 };
      } else {
        jump.t += dt;
        if (jump.t > 0.75) jump = null;
      }
      if (treat) {
        treat.t += dt;
        if (treat.t > THROW_T && !treat.eaten) {
          treat.eaten = true;
          for (let i = 0; i < 4; i++) hearts.push({ x: dogX + 40 + i * 14, y: GY - 140, age: -i * 0.12 });
        }
        if (treat.t > 1.9) treat = null;
      }
    } else if (state === 'sit') {
      sitT += dt;
    }
    hearts.forEach(h => h.age += dt);
    hearts = hearts.filter(h => h.age < 1.2);
  }

  /* ---------- 그리기 도우미 ---------- */
  const FUR = '#ffffff', CREAM = '#f7efe4', EDGE = '#d3d0d8';
  // 몽글몽글한 구름 같은 털 덩어리
  function fluffy(cx, cy, rx, ry, n = 14, r = null, color = FUR) {
    r = r || Math.min(rx, ry) * 0.4;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
    }
    ctx.fillStyle = color; ctx.strokeStyle = EDGE; ctx.lineWidth = 3;
    for (const [x, y] of pts) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.fill(); ctx.stroke();
    for (const [x, y] of pts) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.fill();
  }
  function limb(x1, y1, x2, y2, w) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = EDGE; ctx.lineWidth = w + 3;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = FUR; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function leg(x, a, w = 13) {
    const px = x, py = -36, L = 30;
    const ex = px + Math.sin(a) * L, ey = py + Math.cos(a) * L;
    limb(px, py, ex, ey, w);
    fluffy(ex, ey - 1, 7, 5, 6, 4);
  }
  function heart(x, y, s, alpha) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = '#ff5d7a';
    ctx.translate(x, y); ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, 4); ctx.bezierCurveTo(-10, -4, -6, -12, 0, -6); ctx.bezierCurveTo(6, -12, 10, -4, 0, 4);
    ctx.fill(); ctx.restore();
  }
  function bone(x, y, s = 1, rot = 0) {
    if (!IMG.bone || !IMG.bone.complete) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    ctx.drawImage(IMG.bone, -22, -22, 44, 44);
    ctx.restore();
  }

  for (const k in SRC) { IMG[k] = new Image(); IMG[k].src = SRC[k]; }
  const DOG = 116;   // 강아지 이미지 크기(px)

  function drawDogImg(sx, sy, rot, side = false) {
    // side=true: 옆모습 강아지(원본은 왼쪽을 봄 → 좌우 반전해서 오른쪽(달리는 방향)을 보게 함)
    const img = side ? IMG.side : IMG.dog;
    if (!img.complete) return;
    ctx.save(); ctx.rotate(rot); ctx.scale(side ? -sx : sx, sy);
    if (side) ctx.drawImage(img, -66, -118, 132, 132);
    else ctx.drawImage(img, -DOG / 2, -DOG + 4, DOG, DOG);
    ctx.restore();
  }

  function drawDog() {
    const running = state === 'run';
    const jumping = !!jump;
    const eating = treat && treat.t > 0.5;
    let lift = 0;
    if (jumping) lift = Math.sin(Math.PI * jump.t / 0.75) * 85;
    if (treat && treat.t > 0.6 && treat.t < 1.2) lift = Math.sin((treat.t - 0.6) / 0.6 * Math.PI) * 26;

    ctx.fillStyle = 'rgba(0,0,0,.14)';
    ctx.beginPath(); ctx.ellipse(dogX, GY + 4, 42 - lift * 0.2, 8, 0, 0, 7); ctx.fill();

    ctx.save();
    ctx.translate(dogX, GY - lift);

    if (state === 'sit') {
      // 앉아서 화면을 보며 기다림: 살짝 낮게 눌리고 몸을 좌우로 살랑
      const sway = Math.sin(sitT * 8) * 0.05;
      const breathe = 1 + Math.sin(sitT * 2.5) * 0.015;
      drawDogImg(1.04, 0.88 * breathe, sway - 0.08, true);
      ctx.restore();
      drawBubble();
      ctx.save();               // drawDog 끝의 restore 와 짝 맞추기
      return;
    }

    let sx = 1, sy = 1, rot = 0, bob = 0;
    if (jumping) { rot = -Math.cos(Math.PI * jump.t / 0.75) * 0.3; sx = 1.1; sy = 0.92; }
    else if (running) {
      bob = -Math.abs(Math.sin(runPhase)) * 11;
      rot = 0.06 + Math.sin(runPhase) * 0.07;        // 앞으로 살짝 숙이며 출렁
      sx = 1 + Math.sin(runPhase * 2) * 0.06; sy = 2 - sx;   // 달릴 때 늘었다 줄었다
    } else { sy = 1 + Math.sin(t * 2.2) * 0.015; }
    if (eating) { rot += -0.15; if (treat.eaten) rot += Math.sin(t * 24) * 0.04; }
    ctx.translate(0, bob);
    drawDogImg(sx, sy, rot, true);
    ctx.restore();
  }

  function drawBubble() {
    const bx = dogX + 95, by = GY - 175, bobb = Math.sin(sitT * 3) * 3;
    ctx.save();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#d3d0d8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx - 38, by + 52 + bobb, 4, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(bx - 24, by + 38 + bobb, 7, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(bx + 14, by + bobb, 40, 28, 0, 0, 7); ctx.fill(); ctx.stroke();
    bone(bx + 14, by + bobb, 1.1, -0.3);
    ctx.restore();
  }

  function drawHurdle(h) {
    const x = h.x, y = GY - 4;
    ctx.save(); ctx.lineCap = 'round';
    ctx.strokeStyle = '#8a6a4a'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 52); ctx.moveTo(x + 40, y); ctx.lineTo(x + 40, y - 52); ctx.stroke();
    for (let i = 0; i < 2; i++) {
      const by = y - 48 + i * 18;
      for (let k = 0; k < 4; k++) {
        ctx.fillStyle = k % 2 ? '#fff' : '#ff6b6b';
        ctx.fillRect(x - 3 + k * 11.5, by - 5, 11.5, 10);
      }
      ctx.strokeStyle = '#c0504f'; ctx.lineWidth = 1.5; ctx.strokeRect(x - 3, by - 5, 46, 10);
    }
    ctx.restore();
  }

  // 간식 던지기: 화면 오른쪽 위에서 포물선으로 날아와 강아지 입으로
  function drawTreat() {
    if (!treat || treat.eaten) return;
    const k = Math.min(1, treat.t / THROW_T);
    const sx = W + 30, sy = GY - 230;
    const ex = dogX + 50, ey = GY - 92;
    const x = sx + (ex - sx) * k;
    const y = sy + (ey - sy) * k - Math.sin(Math.PI * k) * 70;
    // 궤적 반짝임
    for (let i = 1; i <= 4; i++) {
      const kk = Math.max(0, k - i * 0.05);
      const tx = sx + (ex - sx) * kk, ty = sy + (ey - sy) * kk - Math.sin(Math.PI * kk) * 70;
      ctx.fillStyle = `rgba(255,214,102,${0.5 - i * 0.1})`;
      ctx.beginPath(); ctx.arc(tx, ty, 6 - i, 0, 7); ctx.fill();
    }
    bone(x, y, 1, k * 9);
  }

  /* ---------- 배경 ---------- */
  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, GY);
    sky.addColorStop(0, '#a9dcff'); sky.addColorStop(1, '#e9f7ff');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(620, 60, 30, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (let i = 0; i < 4; i++) {
      const cx = ((i * 260 - scroll * 0.1 - t * 6) % 1040 + 1040) % 1040 - 160, cy = 50 + (i % 2) * 40;
      ctx.beginPath(); ctx.arc(cx, cy, 20, 0, 7); ctx.arc(cx + 24, cy - 8, 26, 0, 7); ctx.arc(cx + 52, cy, 20, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#bfe3a8';
    for (let i = -1; i < 4; i++) {
      const hx = ((i * 300 - scroll * 0.25) % 1200 + 1200) % 1200 - 300;
      ctx.beginPath(); ctx.ellipse(hx + 150, GY - 10, 190, 70, 0, Math.PI, 0); ctx.fill();
    }
    for (let i = 0; i < 5; i++) {
      const tx = ((i * 230 + 80 - scroll * 0.5) % 1150 + 1150) % 1150 - 150;
      ctx.fillStyle = '#9b6b43'; ctx.fillRect(tx - 5, GY - 62, 10, 60);
      ctx.fillStyle = '#6fbf6f'; ctx.beginPath(); ctx.arc(tx, GY - 78, 28, 0, 7); ctx.arc(tx - 18, GY - 62, 20, 0, 7); ctx.arc(tx + 18, GY - 62, 20, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#8fd17a'; ctx.fillRect(0, GY - 14, W, 14);
    ctx.fillStyle = '#e6cfae'; ctx.fillRect(0, GY, W, H - GY);
    ctx.fillStyle = '#d9bf99'; ctx.fillRect(0, GY, W, 6);
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (let i = -1; i < 12; i++) {
      const dx = ((i * 70 - scroll) % 840 + 840) % 840 - 70;
      ctx.fillRect(dx, GY + 38, 36, 5);
    }
    const fx = START_X - 50 - scroll;
    if (fx > -80) {
      ctx.fillStyle = '#fff'; ctx.fillRect(fx, GY - 8, 6, 58);
      ctx.fillStyle = '#ff6b8b'; ctx.fillRect(fx + 6, GY - 8, 44, 24);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('START', fx + 28, GY + 9);
    }
  }

  function draw() {
    drawBackground();
    hurdles.forEach(drawHurdle);
    drawDog();
    drawTreat();
    for (const h of hearts) if (h.age > 0) heart(h.x, h.y - h.age * 50, 1.6, 1 - h.age / 1.2);
  }

  /* ---------- 루프 ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw();
    if (running) renderTime();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  renderTime();
